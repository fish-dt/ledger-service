apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger-service.fullname" . }}-secret
  labels:
    {{- include "ledger-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # No default in values.yaml -- required() makes `helm install` fail with
  # a clear error if you forget to pass this, instead of silently deploying
  # with an empty or guessable password:
  #   helm install ledger helm/ledger-service --set secrets.dbPassword=$DB_PASSWORD
  DB_PASSWORD: {{ required "secrets.dbPassword is required -- pass it with --set, never commit it" .Values.secrets.dbPassword | quote }}
