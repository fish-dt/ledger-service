name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ledger-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render the Helm chart
        run: |
          helm lint helm/ledger-service
          helm template ledger helm/ledger-service \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ steps.meta.outputs.tag }} > /tmp/rendered.yaml
          cat /tmp/rendered.yaml

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Check for Kubernetes configuration
        id: kube-check
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Helm
        if: steps.kube-check.outputs.configured == 'true'
        uses: azure/setup-helm@v4

      - name: Deploy to cluster
        if: steps.kube-check.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

          helm upgrade --install ledger helm/ledger-service \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-test.outputs.image_tag }} \
            --set secrets.dbPassword="$DB_PASSWORD"

      - name: No cluster configured
        if: steps.kube-check.outputs.configured == 'false'
        run: echo "Skipping deploy: no KUBE_CONFIG secret set."