spring:
  application:
    name: ledger-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    # No fallback for credentials -- these MUST come from the environment
    # (.env locally, a real secret in any other environment). Never commit
    # a default password, even a throwaway dev one, to a file heading to
    # GitHub.
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # NEVER ddl-auto: update for this project — schema lives entirely in Flyway
      # migrations because the balance-invariant constraint trigger can't be
      # expressed as a JPA annotation. This is a deliberate, explainable choice.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    com.portfolio.ledger: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

ledger:
  reconciliation:
    poll-interval-ms: 2000
    batch-size: 20

app:
  # Comma-separated list. The dashboard's origin in local dev; set this to
  # your real frontend's origin(s) in any other environment via the
  # CORS_ALLOWED_ORIGINS env var -- never widen the CorsConfig bean itself.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
